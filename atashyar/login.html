<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود | آتش یار</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header" id="site-header"></header>

  <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1rem">
    <div class="login-box" style="width:100%;max-width:400px">
      <div class="login-logo">
        <div class="icon">🔥</div>
        <h1>ورود به حساب</h1>
        <p>آتش یار | ATASHYAR</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label>ایمیل</label>
          <input type="email" id="email" required dir="ltr" placeholder="email@example.com" />
        </div>
        <div class="form-group">
          <label>رمز عبور</label>
          <input type="password" id="password" required dir="ltr" minlength="6" />
        </div>
        <div id="error-box" class="alert alert-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-full" id="submit-btn">ورود</button>
      </form>

      <p style="text-align:center;margin-top:1.25rem;font-size:.9rem;color:var(--ash)">
        حساب ندارید؟
        <a href="register.html" style="color:var(--primary);font-weight:600">ثبت‌نام</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div>🔥 <strong>آگنی | آتش یار</strong></div>
    <p>تمامی حقوق برای برند آگنی محفوظ است.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Auth.renderHeader('site-header');

    // اگر لاگین بود → حساب
    (async () => {
      const user = await Auth.getUser();
      if (user) location.href = 'account.html';
    })();

    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('error-box');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      err.classList.add('hidden');

      try {
        await Auth.signIn(
          document.getElementById('email').value.trim(),
          document.getElementById('password').value
        );
        const isAdmin = await Auth.isAdmin();
        location.href = isAdmin ? 'admin/dashboard.html' : 'account.html';
      } catch (ex) {
        err.textContent = translateError(ex.message || 'خطا در ورود');
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'ورود';
      }
    };
  </script>
</body>
</html>
