<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پرداخت | آتش یار</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">🔥</span>
        <div>
          <span class="logo-text">آتش یار</span>
          <span class="logo-sub">ATASHYAR</span>
        </div>
      </a>
    </div>
  </header>

  <main style="padding:2.5rem 0;flex:1">
    <div class="container-xs" id="payment-content">
      <!-- filled by JS -->
    </div>
  </main>

  <footer class="footer">
    <div>🔥 <strong>آگنی | آتش یار</strong></div>
    <p>تمامی حقوق برای برند آگنی محفوظ است.</p>
  </footer>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    const orderJson = sessionStorage.getItem('pendingOrder');
    if (!orderJson) {
      location.href = 'index.html';
    } else {
      const order = JSON.parse(orderJson);
      const { CARD_NUMBER, CARD_OWNER } = APP_CONFIG;
      let receiptFile = null;

      document.getElementById('payment-content').innerHTML = `
        <a href="checkout.html?product=${order.productId}" class="back-link">→ بازگشت</a>
        <h1 class="page-title">پرداخت کارت به کارت</h1>
        <p class="page-sub">مبلغ را به کارت زیر واریز کنید و فیش را آپلود نمایید</p>

        <div class="summary-card" style="font-size:.9rem">
          <div style="display:flex;justify-content:space-between;margin-bottom:.25rem">
            <span style="color:var(--ash)">${order.productName}</span>
            <span>× ${order.quantity}</span>
          </div>
          <div class="summary-total">
            <span style="color:var(--ash)">مبلغ قابل پرداخت</span>
            <span class="price" style="font-size:1.2rem">${formatPrice(order.totalPrice)}</span>
          </div>
        </div>

        <!-- تصویر کارت -->
        <div class="card-image-wrap">
          <img src="images/card.png" alt="کارت بانکی" class="card-image" id="card-img"
               onerror="this.style.display='none'; document.getElementById('card-fallback').classList.remove('hidden');" />
          <!-- اگر عکس نبود، کارت CSS نشان داده می‌شود -->
          <div class="card-visual hidden" id="card-fallback">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;position:relative">
              <span style="font-size:1.8rem">💳</span>
              <span style="font-size:.75rem;opacity:.7">کارت به کارت</span>
            </div>
            <div class="card-number">${CARD_NUMBER}</div>
            <div class="card-bottom">
              <div>
                <div class="card-owner-label">به نام</div>
                <div class="card-owner">${CARD_OWNER}</div>
              </div>
            </div>
          </div>
        </div>

        <!-- شماره کارت + کپی -->
        <div class="card-info-box">
          <div>
            <div style="font-size:.75rem;color:var(--ash);margin-bottom:.2rem">شماره کارت</div>
            <div class="card-number-text" id="card-num" dir="ltr">${CARD_NUMBER}</div>
            <div style="font-size:.8rem;color:var(--ash);margin-top:.3rem">به نام: ${CARD_OWNER}</div>
          </div>
          <button class="btn btn-dark btn-sm" id="copy-btn" type="button">📋 کپی</button>
        </div>

        <!-- Upload -->
        <label style="display:block;font-size:.875rem;font-weight:500;margin-bottom:.5rem">آپلود تصویر فیش واریزی</label>
        <div class="upload-zone" id="upload-zone">
          <input type="file" id="file-input" accept="image/*" class="hidden" />
          <div id="upload-placeholder">
            <div class="upload-icon">📤</div>
            <div class="upload-text">کلیک کنید یا فایل را بکشید</div>
            <div class="upload-hint">JPG, PNG — حداکثر ۵ مگابایت</div>
          </div>
          <div id="upload-preview" class="hidden"></div>
        </div>

        <div id="error-box" class="alert alert-error hidden"></div>

        <button class="btn btn-primary btn-full" id="submit-btn" disabled>
          پرداخت کردم — ثبت سفارش
        </button>
        <p style="font-size:.75rem;color:var(--ash);text-align:center;margin-top:1rem">
          پس از ثبت، سفارش شما بررسی و تأیید خواهد شد.
        </p>
      `;

      // Copy
      document.getElementById('copy-btn').onclick = async () => {
        const num = CARD_NUMBER.replace(/-/g, '');
        try {
          await navigator.clipboard.writeText(num);
        } catch {
          const i = document.createElement('input');
          i.value = num; document.body.appendChild(i); i.select();
          document.execCommand('copy'); document.body.removeChild(i);
        }
        const btn = document.getElementById('copy-btn');
        btn.textContent = '✅ کپی شد!';
        setTimeout(() => btn.textContent = '📋 کپی شماره کارت', 2000);
      };

      // Upload
      const zone = document.getElementById('upload-zone');
      const fileInput = document.getElementById('file-input');
      zone.onclick = () => fileInput.click();

      fileInput.onchange = () => {
        const file = fileInput.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          showError('فقط فایل تصویری مجاز است');
          return;
        }
        if (file.size > 5 * 1024 * 1024) {
          showError('حجم فایل نباید بیشتر از ۵ مگابایت باشد');
          return;
        }
        hideError();
        receiptFile = file;
        zone.classList.add('has-file');
        document.getElementById('upload-placeholder').classList.add('hidden');
        const prev = document.getElementById('upload-preview');
        prev.classList.remove('hidden');
        prev.innerHTML = `<img src="${URL.createObjectURL(file)}" alt="فیش" /><p style="font-size:.85rem;color:var(--primary)">برای تغییر کلیک کنید</p>`;
        document.getElementById('submit-btn').disabled = false;
      };

      // Submit
      document.getElementById('submit-btn').onclick = async () => {
        if (!receiptFile) { showError('لطفاً تصویر فیش را آپلود کنید'); return; }

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> در حال ثبت...';
        hideError();

        try {
          const sb = getSupabase();
          const ext = receiptFile.name.split('.').pop();
          const fileName = `receipts/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

          const { error: upErr } = await sb.storage
            .from('receipts')
            .upload(fileName, receiptFile, { contentType: receiptFile.type });
          if (upErr) throw upErr;

          const { data: urlData } = sb.storage.from('receipts').getPublicUrl(fileName);

          const { error: insErr } = await sb.from('orders').insert({
            customer_name: order.name || null,
            phone: order.phone || null,
            address: order.address || null,
            city: order.city || null,
            postal_code: order.postalCode || null,
            notes: order.notes || null,
            product_id: order.productId,
            product_name: order.productName,
            quantity: order.quantity,
            unit_price: order.unitPrice,
            total_price: order.totalPrice,
            receipt_url: urlData.publicUrl,
            status: 'pending',
          });
          if (insErr) throw insErr;

          sessionStorage.removeItem('pendingOrder');
          location.href = 'success.html';
        } catch (err) {
          console.error(err);
          showError(err.message || 'خطا در ثبت سفارش. لطفاً دوباره تلاش کنید.');
          btn.disabled = false;
          btn.textContent = 'پرداخت کردم — ثبت سفارش';
        }
      };

      function showError(msg) {
        const box = document.getElementById('error-box');
        box.textContent = msg;
        box.classList.remove('hidden');
      }
      function hideError() {
        document.getElementById('error-box').classList.add('hidden');
      }
    }
  </script>
</body>
</html>
