<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود ادمین | آتش یار</title>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div class="login-page">
    <div class="login-box">
      <div class="login-logo">
        <div class="icon">🔥</div>
        <h1>ورود ادمین</h1>
        <p>آتش یار | پنل مدیریت</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label>ایمیل</label>
          <input type="email" id="email" required dir="ltr" />
        </div>
        <div class="form-group">
          <label>رمز عبور</label>
          <input type="password" id="password" required dir="ltr" />
        </div>
        <div id="error-box" class="alert alert-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">ورود</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // اگر قبلاً لاگین کرده، مستقیم برو داشبورد
    (async () => {
      const sb = getSupabase();
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        const isAdmin = await Auth.isAdmin();
        location.href = isAdmin ? 'dashboard.html' : '../account.html';
      }
    })();

    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errBox = document.getElementById('error-box');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      errBox.classList.add('hidden');

      const sb = getSupabase();
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      });

      if (error) {
        errBox.textContent = error.message === 'Invalid login credentials'
          ? 'ایمیل یا رمز عبور اشتباه است'
          : error.message;
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'ورود';
        return;
      }
      location.href = 'dashboard.html';
    };
  </script>
</body>
</html>
